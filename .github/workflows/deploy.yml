name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the build to the gh-pages branch

# Production deploys never cancel in flight; PR previews live under
# pr-preview/ on the same branch and are preserved by the copy step below.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          PUBLIC_TRACKING_ENDPOINT: https://wcus-site.wcus-site.workers.dev/track

      - name: Publish to gh-pages (preserving PR previews)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages-tmp
          cd gh-pages-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Replace production content but keep the PR preview umbrella and .nojekyll.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name pr-preview ! -name .nojekyll -exec rm -rf {} +
          cp -r ../dist/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "production site unchanged"
          else
            git commit -qm "Deploy production site from ${{ github.sha }}"
            git push -q origin gh-pages || {
              git pull --rebase -q origin gh-pages && git push -q origin gh-pages
            }
          fi
